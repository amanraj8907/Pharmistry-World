<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Pharmistry World — Admin</title>
  <link rel="stylesheet" href="admin.css?v=20260927-3">
</head>
<body>
  <main class="shell">
    <section id="loginView" class="panel login-panel">
      <div class="brand-mark">PW</div>
      <p class="eyebrow">PHARMISTRY WORLD</p>
      <h1>Admin Control</h1>
      <p class="muted">Sign in to publish notes and pharma industry resources.</p>
      <form id="loginForm">
        <label>Email<input id="email" type="email" autocomplete="username" required></label>
        <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
        <button id="loginBtn" class="btn primary" type="submit">Sign in</button>
        <p id="loginMsg" class="message"></p>
      </form>
    </section>

    <section id="adminView" class="hidden">
      <header class="topbar">
        <div>
          <p class="eyebrow">ADMIN CONTROL</p>
          <h1>Content Manager</h1>
          <p id="userEmail" class="muted"></p>
        </div>
        <button id="logoutBtn" class="btn" type="button">Log out</button>
      </header>

      <nav class="tabs" aria-label="Content sections">
        <button id="notesTab" class="tab active" type="button">B.Pharm Notes</button>
        <button id="industryTab" class="tab" type="button">Pharma Industry</button>
      </nav>

      <section id="notesPanel">
        <section class="panel">
          <div class="section-head">
            <div><p class="eyebrow">PUBLISH</p><h2>Upload a new note</h2></div>
            <span class="badge">PDF only</span>
          </div>
          <form id="uploadForm" class="form-grid">
            <label>Note title<input id="title" required placeholder="e.g. HPLC Basics"></label>
            <label>Semester<select id="semester" required><option value="">Select semester</option><option>1st</option><option>2nd</option><option>3rd</option><option>4th</option><option>5th</option><option>6th</option><option>7th</option><option>8th</option></select></label>
            <label>Subject<input id="subject" required placeholder="e.g. Instrumental Method of Analysis"></label>
            <label>Description<input id="description" placeholder="Short description (optional)"></label>
            <label class="file-field">PDF file<input id="pdf" type="file" accept="application/pdf,.pdf" required><small id="fileName">No file selected</small></label>
            <div class="actions"><button class="btn primary" type="submit">Publish Note</button><span id="uploadMsg" class="message"></span></div>
          </form>
        </section>
        <section class="panel">
          <div class="section-head"><div><p class="eyebrow">MANAGE</p><h2>Published notes</h2></div><button id="refreshBtn" class="btn" type="button">Refresh</button></div>
          <div id="notesList" class="notes-list"></div>
        </section>
      </section>

      <section id="industryPanel" class="hidden">
        <section class="panel">
          <div class="section-head">
            <div><p class="eyebrow">PHARMA INDUSTRY</p><h2>Add industry resource</h2></div>
            <span class="badge">PDF optional</span>
          </div>
          <form id="industryForm" class="form-grid">
            <label>Title<input id="industryTitle" required placeholder="e.g. Dissolution Testing"></label>
            <label>Category<select id="industryCategory" required><option value="">Select category</option><option>Quality Control (QC)</option><option>Quality Assurance (QA)</option><option>Production</option><option>Stability</option><option>Analytical Instruments</option><option>GMP & Documentation</option><option>Regulatory Affairs</option><option>Pharmacovigilance</option><option>Other</option></select></label>
            <label class="wide">Description<textarea id="industryDescription" rows="4" placeholder="Short practical explanation"></textarea></label>
            <label class="file-field">PDF file (optional)<input id="industryPdf" type="file" accept="application/pdf,.pdf"><small id="industryFileName">No PDF selected</small></label>
            <div class="actions"><button class="btn primary" type="submit">Publish Industry Resource</button><span id="industryMsg" class="message"></span></div>
          </form>
        </section>
        <section class="panel">
          <div class="section-head"><div><p class="eyebrow">MANAGE</p><h2>Published industry resources</h2></div><button id="industryRefreshBtn" class="btn" type="button">Refresh</button></div>
          <div id="industryList" class="notes-list"></div>
        </section>
      </section>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
  <script src="admin.js?v=20260927-3"></script>
</body>
</html>
