<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Pharmistry World</title><link rel="stylesheet" href="style.css"></head><body><main class="section soft"><div class="container" style="max-width:700px"><div class="card"><span class="eyebrow">PRIVATE ADMIN</span><h2>Publish a note</h2><p>Sign in with your Supabase Auth account to upload PDFs.</p><form id="f"><input id="e" type="email" placeholder="Email" required style="width:100%;padding:12px;margin:6px 0"><input id="p" type="password" placeholder="Password" required style="width:100%;padding:12px;margin:6px 0"><input id="t" placeholder="Note title" required style="width:100%;padding:12px;margin:6px 0"><select id="s" required style="width:100%;padding:12px;margin:6px 0"><option value="">Semester</option><option>1st</option><option>2nd</option><option>3rd</option><option>4th</option><option>5th</option><option>6th</option><option>7th</option><option>8th</option></select><input id="sub" placeholder="Subject" required style="width:100%;padding:12px;margin:6px 0"><input id="d" placeholder="Description" style="width:100%;padding:12px;margin:6px 0"><input id="file" type="file" accept=".pdf,application/pdf" required style="width:100%;padding:12px;margin:6px 0"><button class="btn primary" type="submit">Upload & Publish</button><p id="msg"></p></form></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="script.js"></script><script>document.getElementById('f').onsubmit=async e=>{e.preventDefault();const m=document.getElementById('msg');m.textContent='Signing in…';const c=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let r=await c.auth.signInWithPassword({email:document.getElementById('e').value,password:document.getElementById('p').value});if(r.error){m.textContent=r.error.message;return}const file=document.getElementById('file').files[0];if(!file||file.type!=='application/pdf'){m.textContent='Select a PDF.';return}m.textContent='Uploading…';const sem=document.getElementById('s').value,path=sem+'/'+Date.now()+'-'+file.name.toLowerCase().replace(/[^a-z0-9._-]+/g,'-');r=await c.storage.from('B. Pharm Notes').upload(path,file,{contentType:'application/pdf'});if(r.error){m.textContent=r.error.message;return}const u=c.storage.from('B. Pharm Notes').getPublicUrl(path).data.publicUrl;r=await c.from('notes').insert({title:document.getElementById('t').value,semester:sem,subject:document.getElementById('sub').value,description:document.getElementById('d').value,pdf_url:u});m.textContent=r.error?r.error.message:'Published successfully!';if(!r.error)e.target.reset()};</script></body></html>
