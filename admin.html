<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Private Pharmistry World content manager."><title>Admin | Pharmistry World</title><link rel="icon" href="logo.png"><link rel="stylesheet" href="style.css"></head><body><main class="admin"><div class="container"><div class="card"><span class="eyebrow">PRIVATE ADMIN</span><h2>Publish a note</h2><p>Sign in with your Supabase Auth account to upload PDFs.</p><form id="f"><input id="e" type="email" placeholder="Email" required><input id="p" type="password" placeholder="Password" required><input id="t" placeholder="Note title" required><select id="s" required><option value="">Semester</option><option>1st</option><option>2nd</option><option>3rd</option><option>4th</option><option>5th</option><option>6th</option><option>7th</option><option>8th</option></select><input id="sub" placeholder="Subject" required><input id="d" placeholder="Description"><input id="file" type="file" accept=".pdf,application/pdf" required><button class="btn primary" type="submit">Upload & Publish</button><p id="msg" class="msg"></p></form></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="script.js"></script><script src="admin.js"></script></body></html>
