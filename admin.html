<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Pharmistry World — Admin</title>
  <link rel="stylesheet" href="admin.css?v=20260927-2">
</head>
<body>
  <main class="shell">
    <section id="loginView" class="panel login-panel">
      <div class="brand-mark">PW</div>
      <p class="eyebrow">PHARMISTRY WORLD</p>
      <h1>Admin Control</h1>
      <p class="muted">Sign in to publish and manage B.Pharm PDF notes.</p>
      <form id="loginForm">
        <label>Email<input id="email" type="email" autocomplete="username" required></label>
        <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
        <button id="loginBtn" class="btn primary" type="submit">Sign in</button>
        <p id="loginMsg" class="message"></p>
      </form>
    </section>

    <section id="adminView" class="hidden">
      <header class="topbar">
        <div>
          <p class="eyebrow">ADMIN CONTROL</p>
          <h1>Notes Library</h1>
          <p id="userEmail" class="muted"></p>
        </div>
        <button id="logoutBtn" class="btn" type="button">Log out</button>
      </header>

      <section class="panel">
        <div class="section-head">
          <div>
            <p class="eyebrow">PUBLISH</p>
            <h2>Upload a new note</h2>
          </div>
          <span class="badge">PDF only</span>
        </div>
        <form id="uploadForm" class="form-grid">
          <label>Note title<input id="title" required placeholder="e.g. HPLC Basics"></label>
          <label>Semester
            <select id="semester" required>
              <option value="">Select semester</option>
              <option value="1st">1st</option><option value="2nd">2nd</option><option value="3rd">3rd</option><option value="4th">4th</option>
              <option value="5th">5th</option><option value="6th">6th</option><option value="7th">7th</option><option value="8th">8th</option>
            </select>
          </label>
          <label>Subject<input id="subject" required placeholder="e.g. Instrumental Method of Analysis"></label>
          <label>Description<input id="description" placeholder="Short description (optional)"></label>
          <label class="file-field">PDF file<input id="pdf" type="file" accept="application/pdf,.pdf" required><small id="fileName">No file selected</small></label>
          <div class="actions">
            <button class="btn primary" type="submit">Publish Note</button>
            <span id="uploadMsg" class="message"></span>
          </div>
        </form>
      </section>

      <section class="panel">
        <div class="section-head">
          <div>
            <p class="eyebrow">MANAGE</p>
            <h2>Published notes</h2>
          </div>
          <button id="refreshBtn" class="btn" type="button">Refresh</button>
        </div>
        <div id="notesList" class="notes-list"></div>
      </section>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
  <script src="admin.js?v=20260927-2"></script>
</body>
</html>
