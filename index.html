<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Pharmistry World Admin</title><link rel="stylesheet" href="../assets/style.css"></head>
<body><main class="admin"><span class="eyebrow">ADMIN PANEL — DEMO</span><h1>Upload Notes</h1>
<p>This is the front-end structure. Real secure upload/login will be connected to Supabase in the next step.</p>
<div class="admin-form">
<label>Note Title<input placeholder="e.g. HPLC Basics"></label>
<label>Semester<select><option>1st Semester</option><option>2nd Semester</option><option>3rd Semester</option><option>4th Semester</option><option>5th Semester</option><option>6th Semester</option><option>7th Semester</option><option>8th Semester</option></select></label>
<label>Subject<input placeholder="e.g. Instrumental Method of Analysis"></label>
<label>PDF File<input type="file" accept=".pdf"></label>
<button class="btn primary" onclick="alert('Supabase upload will be connected here.')">Publish Note</button>
</div></main></body></html>
