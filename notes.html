<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>B.Pharm Notes | Pharmistry World</title>

<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">

<style>

.notes-page{
padding:45px 20px 80px;
min-height:70vh
}

.notes-head{
max-width:1050px;
margin:0 auto 35px
}

.notes-head h1{
font-size:clamp(36px,7vw,56px);
margin:8px 0 12px
}

.notes-head p{
font-size:17px;
line-height:1.7;
opacity:.72;
max-width:750px
}

.breadcrumb{
max-width:1050px;
margin:0 auto 25px;
min-height:45px
}

.breadcrumb h2{
margin:12px 0;
font-size:27px
}

.back-btn{
display:inline-block;
background:#eef5f4;
color:#173c3b;
padding:11px 17px;
border-radius:12px;
font-weight:700;
cursor:pointer
}

.notes-grid{
max-width:1050px;
margin:auto;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px
}

.level-card{
background:#fff;
border:1px solid #e2e8e7;
border-radius:20px;
padding:24px;
min-height:160px;
display:flex;
flex-direction:column;
justify-content:space-between;
cursor:pointer;
box-shadow:0 8px 25px rgba(0,0,0,.05);
transition:.2s
}

.level-card:hover{
transform:translateY(-4px);
border-color:#0f8b82
}

.level-icon{
width:48px;
height:48px;
border-radius:14px;
background:#e9f7f5;
display:grid;
place-items:center;
font-size:22px;
margin-bottom:15px
}

.level-card h3{
margin:0 0 8px;
font-size:20px;
line-height:1.4
}

.level-card p{
margin:0;
color:#65716f
}

.level-arrow{
margin-top:18px;
color:#08786f;
font-weight:800
}

.pdf-card{
background:#fff;
border:1px solid #e1e7e6;
border-radius:20px;
padding:24px;
box-shadow:0 8px 25px rgba(0,0,0,.05)
}

.pdf-top{
display:flex;
gap:14px;
align-items:flex-start
}

.pdf-icon{
width:52px;
height:52px;
flex-shrink:0;
border-radius:14px;
background:#fff0ef;
color:#d63b30;
display:grid;
place-items:center;
font-size:13px;
font-weight:900
}

.pdf-card h3{
margin:4px 0 0;
font-size:19px;
line-height:1.4
}

.pdf-label{
font-size:11px;
font-weight:900;
color:#d63b30;
letter-spacing:.08em
}

.pdf-card p{
color:#687371;
line-height:1.6;
margin:15px 0 20px
}

.pdf-actions{
display:flex;
gap:10px;
flex-wrap:wrap
}

.pdf-btn{
border:0;
border-radius:11px;
padding:11px 15px;
font-size:14px;
font-weight:800;
text-decoration:none;
cursor:pointer
}

.preview-btn{
background:#087f76;
color:#fff
}

.download-btn{
background:#edf3f2;
color:#183b39
}

.empty{
grid-column:1/-1;
text-align:center;
padding:45px 20px;
border-radius:20px;
background:#f7f9f9;
color:#65716f
}


/* =========================
   PDF PREVIEW
========================= */

.pdf-modal{
position:fixed;
inset:0;
z-index:99999;
background:rgba(5,20,20,.96);
display:none;
flex-direction:column
}

.pdf-modal.open{
display:flex
}

.pdf-header{
height:62px;
flex-shrink:0;
background:#102b2a;
color:#fff;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 16px
}

.pdf-header strong{
max-width:75vw;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.close-pdf{
width:40px;
height:40px;
border:0;
border-radius:10px;
background:#ffffff18;
color:#fff;
font-size:25px;
cursor:pointer
}

.pdf-viewer{
flex:1;
overflow:auto;
padding:20px 12px 90px;
-webkit-overflow-scrolling:touch;
text-align:center
}

/* Sharp PDF page */
.pdf-page{
width:min(950px,100%);
margin:0 auto 22px;
background:#fff;
box-shadow:0 8px 30px rgba(0,0,0,.45);
overflow:hidden
}

.pdf-page canvas{
display:block;
width:100%;
height:auto;
margin:0 auto
}

.page-label{
background:#102b2a;
color:#fff;
padding:8px;
font-size:12px;
text-align:center
}

.pdf-loading{
color:#fff;
font-size:16px;
padding:60px 20px
}

.full-download{
display:inline-block;
background:#0d8d83;
color:#fff;
padding:12px 18px;
border-radius:10px;
text-decoration:none;
font-weight:700
}

.pdf-toolbar{
position:fixed;
bottom:0;
left:0;
right:0;
z-index:100000;
background:#102b2af7;
padding:10px;
display:flex;
justify-content:center;
align-items:center;
gap:8px
}

.pdf-toolbar a{
border:0;
border-radius:9px;
padding:10px 15px;
font-weight:700;
text-decoration:none;
cursor:pointer;
background:#0d8d83;
color:#fff
}

.counter{
color:#fff;
font-size:13px
}

@media(max-width:850px){

.notes-grid{
grid-template-columns:repeat(2,1fr)
}

}

@media(max-width:600px){

.notes-page{
padding:30px 15px 60px
}

.notes-grid{
grid-template-columns:1fr
}

.notes-head h1{
font-size:37px
}

.pdf-actions{
display:grid;
grid-template-columns:1fr 1fr
}

.pdf-btn{
text-align:center
}

.pdf-toolbar{
padding:8px
}

.pdf-toolbar a{
font-size:12px;
padding:9px 12px
}

.counter{
font-size:11px
}

.pdf-viewer{
padding:12px 6px 80px
}

}

</style>
</head>
