<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>B.Pharm Notes | Pharmistry World</title>
  <meta name="description" content="B.Pharm semester-wise subjects, unit-wise notes and study resources.">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <link rel="stylesheet" href="style.css?v=20260927">

  <style>
    .notes-page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px 70px;
    }

    .page-heading {
      text-align: center;
      margin-bottom: 30px;
    }

    .page-heading h1 {
      margin-bottom: 8px;
    }

    .page-heading p {
      opacity: .75;
    }

    .semester-grid,
    .subject-grid,
    .unit-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 18px;
      margin-top: 25px;
    }

    .hierarchy-card {
      display: block;
      padding: 22px;
      border-radius: 16px;
      background: #fff;
      border: 1px solid #e5e7eb;
      box-shadow: 0 6px 20px rgba(0,0,0,.06);
      cursor: pointer;
      transition: .2s;
      text-decoration: none;
      color: inherit;
    }

    .hierarchy-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(0,0,0,.10);
    }

    .hierarchy-card h3 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .hierarchy-card p {
      margin: 0;
      opacity: .7;
      font-size: 14px;
    }

    .back-btn {
      display: inline-block;
      margin: 20px 0 5px;
      padding: 10px 16px;
      border-radius: 10px;
      background: #f1f5f9;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
    }

    .pdf-list {
      margin-top: 25px;
      display: grid;
      gap: 15px;
    }

    .pdf-card {
      padding: 18px;
      border-radius: 14px;
      background: #fff;
      border: 1px solid #e5e7eb;
    }

    .pdf-card h3 {
      margin: 0 0 7px;
    }

    .pdf-card p {
      margin: 0 0 12px;
      opacity: .75;
    }

    .view-pdf {
      display: inline-block;
      padding: 9px 14px;
      border-radius: 9px;
      text-decoration: none;
      background: #0f766e;
      color: white;
    }

    .empty {
      text-align: center;
      padding: 35px;
      opacity: .7;
    }

    .loading {
      text-align: center;
      padding: 40px;
    }
  </style>
</head>

<body>

<header>
  <div class="container">
    <div class="brand">
      <a href="index.html">
        <img src="logo.png" alt="Pharmistry World" style="height:48px;">
      </a>
    </div>

    <button class="menu-btn" aria-label="Menu">☰</button>

    <nav>
      <a href="index.html">Home</a>
      <a href="notes.html">B.Pharm Notes</a>
      <a href="industry.html">Pharma Industry</a>
      <a href="career.html">Career</a>
    </nav>
  </div>
</header>

<main class="notes-page">

  <section class="page-heading">
    <h1>B.Pharm Notes</h1>
    <p>Semester → Subject → Unit → Notes</p>
  </section>

  <div id="breadcrumb"></div>

  <div id="notesContent">
    <div class="loading">Loading notes...</div>
  </div>

</main>

<footer>
  <div class="container">
    <p>© 2026 Pharmistry World. All rights reserved.</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://qgmpwanxqytoakmnklvy.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_qlOg73Ee92_uzX9YsaRPIA_dMQX9gub";

const supabaseClient =
  window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const content = document.getElementById("notesContent");
const breadcrumb = document.getElementById("breadcrumb");

let allNotes = [];


/* =========================
   HELPERS
========================= */

function escapeHtml(value) {
  return String(value || "").replace(/[&<>"']/g, ch => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  }[ch]));
}


function safeUrl(value) {
  try {
    const u = new URL(value);

    return ["https:", "http:"].includes(u.protocol)
      ? u.href
      : "#";

  } catch {
    return "#";
  }
}


/* =========================
   LOAD NOTES
========================= */

async function loadNotes() {

  const { data, error } = await supabaseClient
    .from("notes")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {

    console.error(error);

    content.innerHTML =
      "<div class='empty'>Notes load nahi ho paaye. Please try again.</div>";

    return;
  }

  allNotes = data || [];

  showSemesters(false);
}


/* =========================
   SEMESTERS
========================= */

function showSemesters(addHistory = true) {

  if (addHistory) {
    history.pushState(
      { level: "semester" },
      "",
      "#semester"
    );
  }

  breadcrumb.innerHTML = "";

  const semesters = [
    "1st Semester",
    "2nd Semester",
    "3rd Semester",
    "4th Semester",
    "5th Semester",
    "6th Semester",
    "7th Semester",
    "8th Semester"
  ];

  content.innerHTML = `
    <div class="semester-grid">

      ${semesters.map(semester => {

        const count = allNotes.filter(
          n => n.semester === semester
        ).length;

        return `
          <div class="hierarchy-card"
               onclick="showSubjects('${semester}', true)">

            <h3>${semester}</h3>

            <p>
              ${count}
              note${count === 1 ? "" : "s"} available
            </p>

          </div>
        `;

      }).join("")}

    </div>
  `;
}


/* =========================
   SUBJECTS
========================= */

function showSubjects(semester, addHistory = true) {

  if (addHistory) {

    history.pushState(
      {
        level: "subject",
        semester: semester
      },
      "",
      "#subject"
    );
  }

  breadcrumb.innerHTML = `
    <a class="back-btn"
       onclick="history.back()">
       ← All Semesters
    </a>

    <h2>${escapeHtml(semester)}</h2>
  `;

  const subjects = [
    ...new Set(
      allNotes
        .filter(n => n.semester === semester)
        .map(n => n.subject)
        .filter(Boolean)
    )
  ];

  if (!subjects.length) {

    content.innerHTML =
      "<div class='empty'>Is semester mein abhi notes available nahi hain.</div>";

    return;
  }

  content.innerHTML = `
    <div class="subject-grid">

      ${subjects.map(subject => {

        const count = allNotes.filter(
          n =>
            n.semester === semester &&
            n.subject === subject
        ).length;

        return `
          <div class="hierarchy-card"
               onclick="showUnits(
                 '${encodeURIComponent(semester)}',
                 '${encodeURIComponent(subject)}',
                 true
               )">

            <h3>${escapeHtml(subject)}</h3>

            <p>
              ${count}
              resource${count === 1 ? "" : "s"}
            </p>

          </div>
        `;

      }).join("")}

    </div>
  `;
}


/* =========================
   UNITS
========================= */

function showUnits(
  encodedSemester,
  encodedSubject,
  addHistory = true
) {

  const semester =
    decodeURIComponent(encodedSemester);

  const subject =
    decodeURIComponent(encodedSubject);


  if (addHistory) {

    history.pushState(
      {
        level: "unit",
        semester: semester,
        subject: subject
      },
      "",
      "#unit"
    );
  }


  breadcrumb.innerHTML = `
    <a class="back-btn"
       onclick="history.back()">

       ← ${escapeHtml(semester)}

    </a>

    <h2>${escapeHtml(subject)}</h2>
  `;


  const notes = allNotes.filter(
    n =>
      n.semester === semester &&
      n.subject === subject
  );


  const units = [
    ...new Set(
      notes.map(
        n => n.unit || "Other Notes"
      )
    )
  ];


  if (!units.length) {

    content.innerHTML =
      "<div class='empty'>Is subject mein abhi units available nahi hain.</div>";

    return;
  }


  content.innerHTML = `
    <div class="unit-grid">

      ${units.map(unit => {

        const count = notes.filter(
          n =>
            (n.unit || "Other Notes") === unit
        ).length;

        return `
          <div class="hierarchy-card"
               onclick="showPDFs(
                 '${encodeURIComponent(semester)}',
                 '${encodeURIComponent(subject)}',
                 '${encodeURIComponent(unit)}',
                 true
               )">

            <h3>${escapeHtml(unit)}</h3>

            <p>
              ${count}
              note${count === 1 ? "" : "s"}
            </p>

          </div>
        `;

      }).join("")}

    </div>
  `;
}


/* =========================
   PDFS
========================= */

function showPDFs(
  encodedSemester,
  encodedSubject,
  encodedUnit,
  addHistory = true
) {

  const semester =
    decodeURIComponent(encodedSemester);

  const subject =
    decodeURIComponent(encodedSubject);

  const unit =
    decodeURIComponent(encodedUnit);


  if (addHistory) {

    history.pushState(
      {
        level: "pdf",
        semester: semester,
        subject: subject,
        unit: unit
      },
      "",
      "#pdf"
    );
  }


  breadcrumb.innerHTML = `
    <a class="back-btn"
       onclick="history.back()">

       ← ${escapeHtml(subject)}

    </a>

    <h2>${escapeHtml(unit)}</h2>
  `;


  const notes = allNotes.filter(
    n =>
      n.semester === semester &&
      n.subject === subject &&
      (n.unit || "Other Notes") === unit
  );


  if (!notes.length) {

    content.innerHTML =
      "<div class='empty'>Is unit mein abhi notes available nahi hain.</div>";

    return;
  }


  content.innerHTML = `
    <div class="pdf-list">

      ${notes.map(note => `

        <article class="pdf-card">

          <h3>
            ${escapeHtml(note.title)}
          </h3>

          <p>
            ${escapeHtml(
              note.description ||
              "B.Pharm study resource."
            )}
          </p>

          <a
            class="view-pdf"
            href="${safeUrl(note.pdf_url)}"
            target="_blank"
            rel="noopener noreferrer">

            View PDF →

          </a>

        </article>

      `).join("")}

    </div>
  `;
}


/* =========================
   BROWSER BACK BUTTON
========================= */

window.addEventListener("popstate", function(event) {

  const state = event.state;


  if (!state || state.level === "semester") {

    showSemesters(false);

    return;
  }


  if (state.level === "subject") {

    showSubjects(
      state.semester,
      false
    );

    return;
  }


  if (state.level === "unit") {

    showUnits(
      encodeURIComponent(state.semester),
      encodeURIComponent(state.subject),
      false
    );

    return;
  }


  if (state.level === "pdf") {

    showPDFs(
      encodeURIComponent(state.semester),
      encodeURIComponent(state.subject),
      encodeURIComponent(state.unit),
      false
    );

    return;
  }

});


/* =========================
   INITIAL HISTORY STATE
========================= */

if (!history.state) {

  history.replaceState(
    { level: "semester" },
    "",
    "#semester"
  );
}


/* =========================
   START
========================= */

loadNotes();

</script>

</body>
</html>
