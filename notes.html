<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta name="viewport" content="width=device-width,initial-scale=1">

  <meta
    name="description"
    content="Pharmistry World B.Pharm Notes — semester-wise, subject-wise and unit-wise study resources."
  >

  <title>B.Pharm Notes | Pharmistry World</title>

  <link rel="icon" href="logo.png">

  <link
    rel="stylesheet"
    href="style.css?v=20260928-10"
  >

  <style>

    /* =========================
       NOTES PAGE
    ========================= */

    .notes-page {
      min-height: 70vh;
      padding: 48px 20px 80px;
    }

    .notes-head {
      max-width: 1050px;
      margin: 0 auto 38px;
    }

    .notes-head h1 {
      margin: 8px 0 12px;
      font-size: clamp(36px, 7vw, 56px);
      line-height: 1.05;
    }

    .notes-head p {
      max-width: 760px;
      margin: 0;
      font-size: 17px;
      line-height: 1.7;
      opacity: .72;
    }

    .breadcrumb {
      max-width: 1050px;
      margin: 0 auto 28px;
      min-height: 48px;
    }

    .breadcrumb h2 {
      margin: 12px 0 0;
      font-size: 28px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 11px 17px;
      border-radius: 12px;
      background: #eef5f4;
      color: #173c3b;
      text-decoration: none;
      font-weight: 700;
      cursor: pointer;
    }

    .back-btn:hover {
      background: #e1edeb;
    }

    .notes-grid {
      max-width: 1050px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    /* =========================
       SEMESTER / SUBJECT / UNIT
    ========================= */

    .level-card {
      background: #fff;
      border: 1px solid #e2e8e7;
      border-radius: 20px;
      padding: 24px;
      min-height: 170px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(0,0,0,.045);
      transition: .2s ease;
    }

    .level-card:hover {
      transform: translateY(-4px);
      border-color: #0f8b82;
      box-shadow: 0 15px 35px rgba(15,118,110,.12);
    }

    .level-icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: #e9f7f5;
      font-size: 22px;
      margin-bottom: 18px;
    }

    .level-card h3 {
      margin: 0 0 8px;
      font-size: 20px;
      line-height: 1.35;
    }

    .level-card p {
      margin: 0;
      color: #65716f;
      line-height: 1.5;
      font-size: 14px;
    }

    .level-arrow {
      margin-top: 18px;
      color: #08786f;
      font-weight: 800;
    }

    /* =========================
       PDF CARD
    ========================= */

    .pdf-card {
      background: #fff;
      border: 1px solid #e1e7e6;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 8px 25px rgba(0,0,0,.045);
      transition: .2s ease;
    }

    .pdf-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 35px rgba(0,0,0,.08);
    }

    .pdf-top {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .pdf-icon {
      width: 52px;
      height: 52px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: #fff0ef;
      color: #d63b30;
      font-size: 13px;
      font-weight: 900;
    }

    .pdf-label {
      color: #d63b30;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .08em;
      margin-bottom: 5px;
    }

    .pdf-card h3 {
      margin: 0;
      font-size: 19px;
      line-height: 1.4;
    }

    .pdf-card p {
      color: #687371;
      line-height: 1.6;
      margin: 15px 0 20px;
    }

    .pdf-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .pdf-btn {
      border: 0;
      border-radius: 11px;
      padding: 11px 15px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .preview-btn {
      background: #087f76;
      color: white;
    }

    .preview-btn:hover {
      background: #066b64;
    }

    .download-btn {
      background: #edf3f2;
      color: #183b39;
    }

    .download-btn:hover {
      background: #dfe9e7;
    }

    /* =========================
       EMPTY / ERROR
    ========================= */

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 45px 20px;
      border-radius: 20px;
      background: #f7f9f9;
      color: #65716f;
      line-height: 1.7;
    }

    .error-box {
      grid-column: 1 / -1;
      padding: 25px;
      border-radius: 18px;
      background: #fff4f3;
      border: 1px solid #ffd3cf;
      color: #a52820;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    /* =========================
       PDF MODAL
    ========================= */

    .pdf-modal {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: rgba(5,20,20,.90);
      display: none;
      flex-direction: column;
      backdrop-filter: blur(7px);
    }

    .pdf-modal.open {
      display: flex;
    }

    .pdf-modal-header {
      height: 64px;
      flex-shrink: 0;
      background: #102b2a;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 0 18px;
    }

    .pdf-modal-title {
      min-width: 0;
    }

    .pdf-modal-title strong {
      display: block;
      max-width: 65vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pdf-modal-title small {
      display: block;
      margin-top: 2px;
      opacity: .65;
    }

    .modal-close {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 10px;
      background: rgba(255,255,255,.1);
      color: white;
      font-size: 26px;
      cursor: pointer;
    }

    .pdf-viewer {
      flex: 1;
      overflow: auto;
      padding: 25px 15px 105px;
      text-align: center;
    }

    .pdf-page-wrap {
      max-width: 900px;
      margin: 0 auto 22px;
      background: white;
      box-shadow: 0 10px 35px rgba(0,0,0,.35);
      overflow: hidden;
    }

    .pdf-page-wrap canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    .page-number {
      background: #102b2a;
      color: rgba(255,255,255,.75);
      padding: 7px;
      font-size: 12px;
    }

    .pdf-loading {
      color: white;
      padding: 60px 20px;
      text-align: center;
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(255,255,255,.25);
      border-top-color: white;
      border-radius: 50%;
      margin: 0 auto 15px;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       PDF TOOLBAR
    ========================= */

    .pdf-toolbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100000;
      background: rgba(16,43,42,.98);
      border-top: 1px solid rgba(255,255,255,.1);
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .page-nav-btn,
    .full-download {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
    }

    .page-nav-btn {
      background: rgba(255,255,255,.1);
      color: white;
    }

    .page-nav-btn:disabled {
      opacity: .35;
    }

    .page-counter {
      color: white;
      min-width: 90px;
      text-align: center;
      font-size: 13px;
    }

    .full-download {
      background: #0d8d83;
      color: white;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 850px) {

      .notes-grid {
        grid-template-columns: repeat(2, 1fr);
      }

    }

    @media (max-width: 600px) {

      .notes-page {
        padding: 32px 15px 65px;
      }

      .notes-head h1 {
        font-size: 37px;
      }

      .notes-head p {
        font-size: 15px;
      }

      .notes-grid {
        grid-template-columns: 1fr;
        gap: 15px;
      }

      .pdf-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .pdf-btn {
        width: 100%;
        box-sizing: border-box;
      }

      .pdf-modal-header {
        height: 58px;
      }

      .pdf-modal-title strong {
        max-width: 65vw;
        font-size: 14px;
      }

      .pdf-toolbar {
        gap: 5px;
        padding: 8px 6px;
      }

      .page-nav-btn,
      .full-download {
        padding: 9px 9px;
        font-size: 11px;
      }

      .page-counter {
        min-width: 60px;
        font-size: 11px;
      }

    }

  </style>

</head>
